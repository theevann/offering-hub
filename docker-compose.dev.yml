services:
  db:
    platform: linux/amd64
    ports:
      - "5432:5432"

  api:
    build:
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      target: dev
    volumes:
      - ./bot/src:/app/src
    environment:
      NODE_ENV: development
    env_file:
      - ./bot/.env
    command:
      - ./node_modules/.bin/nodemon
      - --signal
      - SIGTERM
      - -i
      - logs/
      - src/index.js

  # web:
