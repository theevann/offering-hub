# Keep the existing development volumes (coie_postgres_data, etc.).
name: coie

services:
  db:
    ports:
      - "5432:5432"

  api:
    build:
      target: dev
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data:ro
      - ./data/logs:/data/logs
      - ./api:/app
      - /app/node_modules
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      target: dev
    command: ["npm", "run", "dev:worker"]
    volumes:
      - ./data:/data:ro
      - ./data/logs:/data/logs
      - ./api:/app
      - /app/node_modules
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      target: dev
    volumes:
      - ./data:/data
      - ./bot/src:/app/src
    env_file:
      - ./bot/.env

  # web:
