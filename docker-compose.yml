services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: offerings_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: offerings_api

  bot:
    build: ./bot
    container_name: offerings_bot
    shm_size: "1gb"
    depends_on:
      - api
    volumes:
      - bot_session:/app/session
      - bot_logs:/app/logs

  # web:
  #   build: ./web
  #   container_name: offerings_frontend
  #   restart: always
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     API_BASE_URL: http://api:3000
  #   depends_on:
  #     - api

volumes:
  postgres_data:
  bot_session:
  bot_logs:
